---
# Install and configure Elasticsearch for Mastodon search functionality
- name: Add Elasticsearch GPG key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /etc/apt/trusted.gpg.d/elasticsearch.asc
    mode: '0644'

- name: Add Elasticsearch repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/trusted.gpg.d/elasticsearch.asc] https://artifacts.elastic.co/packages/7.x/apt stable main"
    state: present
    update_cache: true
    filename: elasticsearch

- name: Install OpenJDK 21 (required for Elasticsearch)
  ansible.builtin.apt:
    name:
      - openjdk-21-jdk
      - openjdk-21-jre
    state: present

- name: Install Elasticsearch
  ansible.builtin.apt:
    name: elasticsearch
    state: present

- name: Configure Elasticsearch for Mastodon
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
    backup: true
  notify: restart elasticsearch

- name: Set Elasticsearch heap size (half of available memory, max 32GB)
  ansible.builtin.lineinfile:
    path: /etc/elasticsearch/jvm.options.d/mastodon.options
    line: "{{ item }}"
    create: true
  with_items:
    - "-Xms1g"
    - "-Xmx1g"
  notify: restart elasticsearch

- name: Enable and start Elasticsearch service
  ansible.builtin.systemd:
    name: elasticsearch
    enabled: true
    state: started

- name: Wait for Elasticsearch to start
  ansible.builtin.wait_for:
    port: 9200
    host: localhost
    delay: 10
    timeout: 60

- name: Test Elasticsearch connection
  ansible.builtin.uri:
    url: "http://localhost:9200/"
    method: GET
    timeout: 10
  register: elasticsearch_test
  retries: 5
  delay: 10
  until: elasticsearch_test.status == 200